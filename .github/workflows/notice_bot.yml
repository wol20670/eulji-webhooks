name: 을지대 공지 알림봇

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행
  workflow_dispatch:          # GitHub UI에서 수동 실행 가능

permissions:
  contents: write  # latest_notices.json 커밋을 위해 필요

jobs:
  check-notices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 공지 확인 및 알림 전송
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python notice_bot.py

      - name: 히스토리 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_notices.json
          git diff --staged --quiet || git commit -m "chore: update notice history [skip ci]"
          git push
